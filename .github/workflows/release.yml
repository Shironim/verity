name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run automated test suite
        run: bun test

      - name: Compile multi-platform binaries
        run: |
          mkdir -p bin
          echo "🔨 Compiling linux-x64..."
          bun build ./src/cli/index.ts --compile --target=bun-linux-x64 --outfile ./bin/verity-linux-x64
          
          echo "🔨 Compiling linux-arm64..."
          bun build ./src/cli/index.ts --compile --target=bun-linux-arm64 --outfile ./bin/verity-linux-arm64
          
          echo "🔨 Compiling darwin-arm64 (Apple Silicon)..."
          bun build ./src/cli/index.ts --compile --target=bun-darwin-arm64 --outfile ./bin/verity-darwin-arm64
          
          echo "🔨 Compiling darwin-x64 (macOS Intel)..."
          bun build ./src/cli/index.ts --compile --target=bun-darwin-x64 --outfile ./bin/verity-darwin-x64
          
          echo "🔨 Compiling windows-x64..."
          bun build ./src/cli/index.ts --compile --target=bun-windows-x64 --outfile ./bin/verity-windows-x64.exe

      - name: Generate SHA256 checksums
        run: |
          cd bin
          sha256sum verity-* > checksums.txt
          cat checksums.txt

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/verity-linux-x64
            bin/verity-linux-arm64
            bin/verity-darwin-arm64
            bin/verity-darwin-x64
            bin/verity-windows-x64.exe
            bin/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
